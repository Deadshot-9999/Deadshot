name: Refresh listing data
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Fetch Magicbricks projects
        run: npm run fetch:magicbricks
        continue-on-error: true
      - name: Build map data
        run: node pipeline/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "flat-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data pipeline/.cache pipeline/raw || true
          if ! git diff --cached --quiet; then git commit -m "Refresh listing data" && git push; fi
